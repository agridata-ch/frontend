on:
  workflow_call:

jobs:
  unit-test-sonarqube:
    name: Unit Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/

      - name: Run unit tests
        run: npm run test:coverage

      - name: Run architecture tests
        run: npm run test:arch

      # Vitest's v8 reporter emits full branch/condition data that the old Jest lcov didn't.
      # Sonar folds conditions into its coverage metric, so keep it line-based as before.
      - name: Strip branch data from lcov (Sonar measures line coverage)
        run: sed -i -E '/^BR(DA|F|H):/d' coverage/lcov.info

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=agridata-ch
            -Dsonar.projectKey=agridata-ch_frontend
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
