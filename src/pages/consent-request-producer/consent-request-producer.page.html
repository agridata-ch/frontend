<app-consent-request-migration-alerts [requests]="consentRequests()" />
<ng-container *i18n="let t; prefix: 'producer'">
  <div class="flex gap-3 items-center mb-8">
    <fa-icon [icon]="fileIcon" size="2xl" />
    <h1>{{ t('pageTitle') }}</h1>
  </div>
</ng-container>
@if (uidMissing()) {
<app-alert
  [type]="AlertType.WARNING"
  [showCloseButton]="false"
  class="mb-4"
  [message]="uidMissingWarning()"
/>
}
<app-error-outlet></app-error-outlet>
<app-consent-request-table
  [consentRequestAggregations]="consentRequests()"
  (tableRowAction)="navigateToRequest($event)"
  [consentRequestAggregationsResource]="consentRequestResource"
  [aggregationId]="aggregationId()"
/>
<router-outlet></router-outlet>
@if (showTourIntro()) {
<app-consent-requests-tour-intro (closeTourIntroCallback)="closeTourIntro()" />
}
