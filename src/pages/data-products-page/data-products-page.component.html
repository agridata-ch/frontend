<ng-container *i18n="let t; prefix: 'data-products'">
  <div class="flex justify-between items-center mb-8">
    <div class="flex gap-3 items-center">
      <fa-icon [icon]="faLayerGroup" size="2xl" />
      <h1>{{ t('pageTitle') }}</h1>
    </div>
    <app-agridata-button
      [variant]="ButtonVariants.Primary"
      (handleClick)="newProduct()"
      (keydown.enter)="newProduct()"
    >
      <fa-icon [icon]="buttonIcon" class="mr-2" />
      <span>{{ t('createNew') }}</span>
    </app-agridata-button>
  </div>
  <app-error-outlet></app-error-outlet>
  <router-outlet />
  <app-agridata-table
    [dataProvider]="fetchDataProductsResource"
    [tableMetadata]="dataProductsTableMetaData()"
    [(queryParameters)]="resourceQueryDto"
  >
    <ng-template #nameTemplate [appDataProductDtoGuard] let-item>
      <span
        class="text-agridata-primary-600 agridata-ellipsis-multiline"
        [appTooltip]="this.i18nService.useObjectTranslation(item?.name)"
      >
        {{ this.i18nService.useObjectTranslation(item?.name) }}
      </span>
    </ng-template>
    <ng-template #stateCodeTemplate [appDataProductDtoGuard] let-item>
      <app-agridata-badge
        [text]="getStatusTranslation(getDataProductState(item), i18nService)"
        [variant]="getBadgeVariant(getDataProductState(item))"
        [size]="BadgeSize.SM"
      />
    </ng-template>
  </app-agridata-table>
  <app-data-products-delete-modal
    [(product)]="productToDelete"
    (handleDeleted)="fetchDataProductsResource.reload()"
  />
</ng-container>
