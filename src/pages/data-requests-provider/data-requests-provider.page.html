<ng-container *i18n="let t; prefix: 'provider'">
  <div class="flex gap-3 items-center mb-8">
    <fa-icon [icon]="icon" size="2xl" />
    <h1>{{ t('pageTitle') }}</h1>
  </div>
  <app-error-outlet></app-error-outlet>
  <router-outlet></router-outlet>
  <app-data-request-provider-table
    [dataRequests]="dataRequests()"
    [dataRequestsResource]="dataRequestsResource"
    (tableRowAction)="navigateToRequest($event)"
  ></app-data-request-provider-table>
</ng-container>
<div class="flex justify-end"></div>
