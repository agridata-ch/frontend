<div
  class="relative flex h-full w-full items-center justify-center bg-[url('/assets/images/forbidden-bg.webp')] bg-cover bg-center bg-no-repeat saturate-50 py-4 px-6"
>
  <div class="absolute right-0 top-0 bottom-0 w-full bg-agridata-primary-text/85"></div>

  <ng-container *i18n="let t; prefix: 'no-access'">
    <div class="flex flex-col items-center gap-10 z-10">
      <div class="flex flex-col items-center gap-4">
        <fa-icon [icon]="seedlingIcon" size="3x" class="text-white" aria-hidden="true" />
        <h1 class="text-white text-center">{{ t('title') }}</h1>
        <span class="text-lg text-center text-white whitespace-break-spaces"
          >{{ t('message') }}</span
        >
      </div>
      <div class="flex flex-wrap items-center justify-center gap-8">
        <app-agridata-button
          [variant]="ButtonVariants.SecondaryCms"
          [icon]="backIcon"
          (handleClick)="handleReturn()"
        >
          {{ t('return') }}
        </app-agridata-button>
        <app-agridata-button
          [variant]="ButtonVariants.PrimaryCms"
          [href]="supportUrl"
          [target]="HrefTarget.Blank"
          [icon]="externalIcon"
          [iconPosition]="IconPosition.Right"
        >
          {{ t('contactSupport') }}
        </app-agridata-button>
      </div>
    </div>
  </ng-container>
</div>
