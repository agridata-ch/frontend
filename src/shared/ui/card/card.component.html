<div class="flex flex-col gap-6 h-full rounded-lg border border-gray-200 bg-white p-6 pt-10">
  @if (loading()) {
    <div class="flex flex-col gap-4" aria-hidden="true">
      <div class="h-8 w-3/4 rounded bg-gray-200 animate-pulse"></div>
      <div class="flex gap-2">
        <div class="h-5 w-20 rounded bg-gray-200 animate-pulse"></div>
        <div class="h-5 w-16 rounded bg-gray-200 animate-pulse"></div>
      </div>
    </div>
    <div class="flex flex-col gap-2" aria-hidden="true">
      <div class="h-4 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-4 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-4 w-2/3 rounded bg-gray-200 animate-pulse"></div>
    </div>
  } @else {
    <div class="flex flex-col gap-4">
      <span
        class="font-semibold text-2xl line-clamp-2 wrap-break-word"
        [appTooltip]="title()"
        [tooltipShowDelay]="800"
      >
        {{ title() }}
      </span>

      <ng-content select="[cardTags]"></ng-content>
      <ng-content select="[cardLabels]"></ng-content>
    </div>
    <p class="line-clamp-7 text-agridata-tertiary-text">{{ description() }}</p>
    <div class="mt-auto">
      <ng-content select="[cardFooter]"></ng-content>
    </div>
  }
</div>
