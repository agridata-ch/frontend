<div class="fixed top-28 right-4 flex flex-col space-y-3 items-end z-20">
  @for (toast of toasts(); track toast.id) {
    <div
      class="border rounded-lg border-transparent shadow-xl p-4 flex items-center cursor-pointer w-fit max-w-[850px]"
      [class]="getToastClasses(toast)"
      [class.animate-toast-in]="toast.state === ToastState.Enter"
      [class.animate-toast-out]="toast.state === ToastState.Exit"
    >
      <div class="flex items-center gap-4">
        <fa-icon size="xl" [icon]="toast.type === 'error' ? errorIcon : successIcon" />
        <div class="flex flex-col">
          <span class="font-medium">{{ toast.title }}</span>
          <span>{{ toast.message }}</span>
        </div>
        @if (toast.undoAction) {
          <app-agridata-button
            [variant]="ButtonVariants.Link"
            (handleClick)="handleUndoAction(toast)"
          >
            {{ toast.undoAction.label | i18n }}
          </app-agridata-button>
        }
        <app-agridata-button
          additionalClass="max-md:self-start"
          [ariaLabel]="'common.ariaLabel.close' | i18n"
          [size]="ButtonSize.MD"
          [variant]="ButtonVariants.Icon"
          [dataTestId]="`${toast.id}-close`"
          (handleClick)="dismiss(toast.id)"
        >
          <fa-icon size="xl" [icon]="closeIcon"></fa-icon>
        </app-agridata-button>
      </div>
    </div>
  }
</div>
