<div class="flex flex-col gap-4" *i18n="let t; prefix: 'data-request.privacy'; lang: lang()">
  <h4>{{ t('title') }}</h4>
  @if (isForeignConsumer()) {
    <app-alert
      [type]="AlertType.INFO"
      [title]="t('foreignConsumerAlert.title')"
      [message]="
        t('foreignConsumerAlert.message', {
          city: dataConsumerCity(),
          country: countryDisplayName(),
        })
      "
    />
  }
  <span
    class="text-agridata-primary-text whitespace-pre-line"
    [i18nFormat]="t('description', { consumer: consumerName(), provider: providerName() })"
  >
  </span>
  @if (contractRevisionId(); as revisionId) {
    <app-agridata-button
      [variant]="ButtonVariants.IconLink"
      [icon]="faExternalLink"
      [iconPosition]="IconPosition.Right"
      [loading]="downloads.isOpening(revisionId)"
      [disabled]="downloads.isOpening(revisionId)"
      (handleClick)="handleOpenPdf(revisionId)"
    >
      <span class="text-md">
        {{ t('viewContract') }}
      </span>
    </app-agridata-button>
  }
</div>
