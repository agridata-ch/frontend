<ng-container *i18n="let t; prefix: 'consent-request.emptyState'">
  <app-empty-state [title]="t('title')" [message]="t('message')">
    <fa-icon
      emptyStateIcon
      [icon]="seedlingIcon"
      size="3x"
      class="text-agridata-tertiary-text"
      aria-hidden="true"
    />
    <p class="text-agridata-tertiary-text" emptyStateAction>
      {{ t('additionalInfo') }}
      <a [href]="appBaseUrl" target="_blank" class="text-agridata-primary-600 hover:underline">
        agridata.ch
      </a>
    </p>
  </app-empty-state>
</ng-container>
