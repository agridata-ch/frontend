<app-card [title]="name()" [description]="description()" *i18n="let t; prefix: 'data-catalog'">
  <div cardTags class="flex gap-2">
    @if (providerName()) {
      <app-agridata-badge
        [text]="providerName()"
        [variant]="BadgeVariant.DARK"
        [size]="BadgeSize.SM"
      />
    }
    @if (sourceSystemName()) {
      <app-agridata-badge
        [text]="sourceSystemName()"
        [variant]="BadgeVariant.DARK"
        [size]="BadgeSize.SM"
      />
    }
    @if (product().deprecatedSince) {
      <app-agridata-badge
        [text]="t('product.deprecated')"
        [variant]="BadgeVariant.ERROR"
        [size]="BadgeSize.SM"
      />
    }
  </div>
  @if (!product().consentRequired) {
    <div cardLabels class="flex gap-2">
      <app-agridata-badge
        [icon]="publicSectorIcon"
        [text]="t('product.publicSector')"
        [variant]="BadgeVariant.DEFAULT"
        [size]="BadgeSize.SM"
      />
    </div>
  }
  <div cardFooter class="flex justify-end">
    <app-agridata-button
      [variant]="ButtonVariants.Secondary"
      (handleClick)="handleShowDetails.emit(product().id)"
    >
      {{ t('product.showDetails') }}
    </app-agridata-button>
  </div>
</app-card>
