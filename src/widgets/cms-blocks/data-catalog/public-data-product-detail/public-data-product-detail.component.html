<app-modal
  [open]="!!productId()"
  [title]="title()"
  [dataTestId]="'public-data-product-detail-modal'"
  (closed)="handleClose.emit()"
>
  <app-data-product-detail
    [productId]="productId()"
    [source]="sources.publicSource"
    (handleNameLoaded)="title.set($event)"
    (handleLoadFailed)="handleClose.emit()"
  />
</app-modal>
