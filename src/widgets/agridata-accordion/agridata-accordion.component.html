<div
  class="flex flex-col bg-white w-full border border-agridata-stroke rounded-lg bg-opacity-50 hover:border-gray-400"
>
  <button
    type="button"
    class="flex justify-between items-center py-6 px-6 hover:text-agridata-primary-700"
    [class.text-agridata-primary-600]="skin() === ACCORDION_SKIN.DEFAULT"
    [class.text-agridata-primary-text]="skin() === ACCORDION_SKIN.PUBLIC"
    [class.font-semibold]="skin() === ACCORDION_SKIN.PUBLIC"
    [attr.aria-expanded]="isExpanded()"
    (click)="toggleAccordion()"
  >
    <span class="text-left text-md line-clamp-3" [appTooltip]="header()" [tooltipShowDelay]="1000">
      {{ header() }}
    </span>
    <fa-icon [icon]="expandIcon()"></fa-icon>
  </button>
  <div
    #contentWrapper
    class="overflow-hidden transition-all ease-in-out duration-300 font-normal"
    style="height: 0px"
    [attr.inert]="isExpanded() ? null : ''"
  >
    <div #contentInner class="pb-4 px-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
