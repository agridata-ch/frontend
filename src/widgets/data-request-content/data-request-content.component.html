<div class="flex flex-col gap-10 py-4">
  <div class="flex flex-col gap-4">
    <app-agridata-contact-card
      [name]="consumerDisplayName()"
      [imageUrl]="dataRequest().dataConsumerLogoBase64"
      [secondaryName]="dataRequest().dataConsumerCity"
      [size]="AvatarSize.MEDIUM"
      [skin]="AvatarSkin.LIGHT"
      [showForeignBadge]="isForeignConsumer()"
    />
    <h3 class="text-agridata-primary-text">
      {{ title() }}
    </h3>
    <span class="text-agridata-primary-text">
      {{ description() }}
    </span>
    <!-- The ids anchor the product tour steps. They are only set without an explicit language,
    because the tour runs on the single language view while the request preview renders this content
    once per language. -->
    <app-data-request-products-accordion
      [attr.id]="lang() ? null : 'data-request-products-accordion'"
      [products]="products()"
      [consumerName]="consumerDisplayName()"
      [providerName]="providerName()"
      [lang]="lang()"
    />
  </div>

  @if (dataRequest().advantages.length) {
    <app-data-request-advantages [advantages]="dataRequest().advantages" [lang]="lang()" />
  }

  <app-data-request-purpose
    [attr.id]="lang() ? null : 'data-request-purpose'"
    [purpose]="dataRequest().purpose"
    [consumerName]="consumerDisplayName()"
    [lang]="lang()"
  />

  <app-data-request-consent-request-decisions [consumerName]="consumerDisplayName()" />

  <app-data-request-privacy-infos
    [consumerName]="consumerDisplayName()"
    [providerName]="providerName()"
    [lang]="lang()"
    [dataConsumerCity]="dataRequest().dataConsumerCity"
    [dataConsumerCountry]="dataRequest().dataConsumerCountry"
    [isForeignConsumer]="isForeignConsumer()"
  />

  <app-data-request-contact
    [phoneNumber]="dataRequest().contactPhoneNumber"
    [email]="dataRequest().contactEmailAddress"
    [organisationName]="consumerDisplayName()"
    [lang]="lang()"
  />
</div>
