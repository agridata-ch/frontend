<div
  class="flex flex-col gap-2 rounded-lg"
  *i18n="let t; prefix: 'data-request.products'; lang: currentLanguage()"
>
  <app-agridata-accordion
    [header]="t('description', { consumer: consumerName(), provider: providerName() })"
  >
    <div class="flex flex-col gap-6">
      @for (product of productsList(); track product.id) {
        <div class="flex flex-col gap-1">
          <span class="text-agridata-secondary-text font-bold">
            {{ getFieldFromLang(product, 'name') }}
          </span>
          <span class="text-agridata-primary-text whitespace-pre-line">
            {{ getFieldFromLang(product, 'description') }}
          </span>
          <button
            type="button"
            class="self-start text-agridata-primary-600 hover:underline cursor-pointer"
            (click)="selectedProductId.set(product.id)"
          >
            {{ t('moreInfos') }}
          </button>
        </div>
      }
    </div>
  </app-agridata-accordion>
  <app-modal
    [open]="!!selectedProductId()"
    [title]="detailTitle()"
    dataTestId="data-product-detail-modal"
    (closed)="selectedProductId.set(undefined)"
  >
    <app-data-product-detail
      [productId]="selectedProductId()"
      [source]="sources.internalSource"
      (handleNameLoaded)="detailTitle.set($event)"
      (handleLoadFailed)="selectedProductId.set(undefined)"
    />
  </app-modal>
</div>
