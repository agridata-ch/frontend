<app-card
  [title]="article().title"
  [description]="article().teaserText"
  [imageUrl]="imageUrl()"
  [imageAlt]="imageAlt()"
  (handleClick)="routeToDetail(article().slug)"
>
  <div cardTags class="flex items-center justify-between gap-2">
    @if (article().publishedAt; as publishedDate) {
      <span class="text-sm text-agridata-tertiary-text leading-tight">
        {{ publishedDate | agridataDate }}
      </span>
    }
    @if (article().category; as category) {
      <app-agridata-badge
        [text]="category.name"
        [variant]="BadgeVariant.DARK"
        [size]="BadgeSize.SM"
      />
    }
  </div>

  <div cardFooter class="flex justify-end">
    <app-agridata-button
      [size]="ButtonSize.MD"
      [variant]="ButtonVariants.Secondary"
      (handleClick)="routeToDetail(article().slug)"
    >
      {{ 'news.readMore' | i18n }}
    </app-agridata-button>
  </div>
</app-card>
