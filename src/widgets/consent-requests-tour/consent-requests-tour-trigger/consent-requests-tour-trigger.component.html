<div class="flex flex-col gap-2" *i18n="let t; prefix: 'product-tour'">
  <span class="font-semibold">{{ t('title') }}</span>
  <div class="flex flex-col xl:border border-agridata-stroke rounded-lg">
    <app-agridata-button
      [variant]="ButtonVariants.IconLink"
      [icon]="progressIcon"
      additionalClass="w-full p-4 justify-start font-normal text-inherit xl:text-agridata-primary-600 outline-agridata-primary-600"
      (handleClick)="startTour()"
    >
      {{ t('startTour') }}
    </app-agridata-button>
  </div>
</div>
